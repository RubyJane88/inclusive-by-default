[pytest]
testpaths = tests
# Full Chromium, not the headless shell: the shell's GPU
# process crashed under pytest on macOS (Chromium 156).
addopts = -q --no-header -p no:cacheprovider -rN
    --browser chromium --browser-channel chromium
markers =
    skip_axe(reason): skip the automatic axe check; a reason is required
